<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algoritmo del banquero – Hospital</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="top">
  <button id="bStart">Iniciar</button>
  <button id="bPause">Pausar</button>
  <button id="bNext">Siguiente paso</button>
  <button id="bReset">Reiniciar</button>
  <label>Velocidad <input id="speed" type="range" min="0.5" max="3" step="0.25" value="1"></label>
  <button id="bSafe">Ejemplo seguro</button>
  <button id="bUnsafe">Ejemplo inseguro</button>
  <button id="bCalc">Ver cálculo</button>
</header>
<main><svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Escena de hospital"></svg></main>
<footer id="bottom">
  <div id="msg"></div>
  <div id="avail"></div>
  <div id="note">Analogía educativa de recursos reutilizables (A: equipos de cama, B: respiradores, C: equipos de monitoreo); no modela decisiones clínicas. Cada paciente es un proceso de atención que puede requerir varias unidades.</div>
</footer>
<div id="modal" hidden><div class="box"><button id="bClose">Cerrar</button><div id="calc"></div></div></div>
<script src="banker.js"></script>
<script src="assets/scene.js"></script>
<script src="app.js"></script>
</body>
</html>
